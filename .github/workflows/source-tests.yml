name: Portable source tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: firmware/inspection
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Create isolated environment
        run: python -m venv .venv
      - name: Install dependencies
        run: python -c "import os,subprocess; executable='.venv/Scripts/python.exe' if os.name=='nt' else '.venv/bin/python'; subprocess.run([executable,'-m','pip','install','-r','requirements.txt'],check=True)"
      - name: Run portable tests
        run: python -c "import os,subprocess; executable='.venv/Scripts/python.exe' if os.name=='nt' else '.venv/bin/python'; subprocess.run([executable,'-m','unittest','discover','-s','tests','-v'],check=True)"
