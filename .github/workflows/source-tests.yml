name: Portable source tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: firmware/inspection
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Create isolated environment
        run: python -m venv .venv
      - name: Install dependencies
        run: python -c "import os,subprocess; executable='.venv/Scripts/python.exe' if os.name=='nt' else '.venv/bin/python'; subprocess.run([executable,'-m','pip','install','-r','requirements.txt'],check=True)"
      - name: Run portable tests
        run: python -c "import os,subprocess; executable='.venv/Scripts/python.exe' if os.name=='nt' else '.venv/bin/python'; subprocess.run([executable,'-m','unittest','discover','-s','tests','-v'],check=True)"
